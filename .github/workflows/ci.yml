name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-fcitx5-clang:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        include:
          - { arch: x86_64, cmake_arch: AMD64, pkg_arch: x86_64  }
          - { arch: arm64, cmake_arch: ARM64, pkg_arch: aarch64 }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm `
            mingw-w64-clang-${{ matrix.pkg_arch }}-extra-cmake-modules `
            mingw-w64-clang-${{ matrix.pkg_arch }}-dlfcn `
            mingw-w64-clang-${{ matrix.pkg_arch }}-libuv `
            mingw-w64-clang-x86_64-clang `
            mingw-w64-clang-x86_64-cmake `
            mingw-w64-clang-x86_64-ninja `
            mingw-w64-clang-x86_64-pkgconf `
            mingw-w64-clang-x86_64-gettext-tools
          if ("${{ matrix.arch }}" -eq "arm64") {
            C:/msys64/usr/bin/pacman -S --noconfirm `
              mingw-w64-clang-aarch64-clang
          }
          Add-Content $env:GITHUB_PATH "C:/msys64/clang64/bin"

      - name: Apply Windows compatibility patches
        run: ./scripts/apply-pinyin-patches.ps1

      - name: Build
        run: |
          cmake -B build/${{ matrix.arch }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DARCH=${{ matrix.cmake_arch }}
          cmake --build build/${{ matrix.arch }}

      - name: Package
        env:
          DESTDIR: dist/${{ matrix.arch }}
        run: |
          cmake --install build/${{ matrix.arch }}
          $prefixLine = cmake -LA -N build/${{ matrix.arch }} |
            Select-String '^CMAKE_INSTALL_PREFIX:'
          if (!$prefixLine) { throw 'CMAKE_INSTALL_PREFIX was not found in the build cache.' }
          $prefix = ($prefixLine.Line -split '=', 2)[1]
          $relativePrefix = $prefix -replace '^[A-Za-z]:[\\/]*', ''
          $stagingRoot = (Resolve-Path "dist/${{ matrix.arch }}").Path
          $installRoot = Join-Path $stagingRoot $relativePrefix
          if (!(Test-Path (Join-Path $installRoot 'bin'))) {
            throw "Installed bin directory was not found at $installRoot"
          }
          $archive = Join-Path (Split-Path -Parent $stagingRoot) "Fcitx5-${{ matrix.arch }}-dev.tar.bz2"
          Push-Location $installRoot
          try {
            tar cjf $archive bin/lib* include lib
          } finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Fcitx5-${{ matrix.arch }}
          path: |
            dist/Fcitx5-${{ matrix.arch }}*.tar.bz2

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

  build-win32:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: win32
    steps:
      - name: Disable CRLF
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check validity
        run: md5sum -c checksum

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

  test-pinyin-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Core dependencies
        run: |
          C:/msys64/usr/bin/pacman -S --noconfirm `
            mingw-w64-clang-x86_64-clang `
            mingw-w64-clang-x86_64-cmake `
            mingw-w64-clang-x86_64-ninja `
            mingw-w64-clang-x86_64-pkgconf `
            mingw-w64-clang-x86_64-gettext-tools `
            mingw-w64-clang-x86_64-extra-cmake-modules `
            mingw-w64-clang-x86_64-dlfcn `
            mingw-w64-clang-x86_64-libuv `
            mingw-w64-clang-x86_64-boost `
            mingw-w64-clang-x86_64-zstd

      - name: Build and deploy Pinyin Core
        run: ./scripts/build-pinyin.ps1 -DataMode Prebuilt

      - name: Build TSF with Windows SDK and ATL
        run: |
          $vs = & 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe' `
            -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (!$vs) { throw 'Visual Studio with ATL is required.' }
          & cmd.exe /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=amd64 >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              }
            }
          cmake -S win32 -B win32/build/pinyin-tsf -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            '-DCMAKE_C_COMPILER=C:/Program Files/LLVM/bin/clang.exe' `
            '-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang++.exe' `
            -DCMAKE_MAKE_PROGRAM=C:/msys64/clang64/bin/ninja.exe
          cmake --build win32/build/pinyin-tsf

      - name: Verify real Pinyin and unregistered TSF text contexts
        run: ./scripts/test-pinyin.ps1

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pinyin-test-logs
          path: build/pinyin-test/*.log

  build-settings:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Build framework-dependent WinUI settings
        run: ./scripts/build-settings.ps1 -Configuration Release
      - name: Upload settings application
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-settings-x64
          path: |
            win32/build/settings/Release/*.exe
            win32/build/settings/Release/*.dll
            win32/build/settings/Release/*.pri
            win32/build/settings/Release/*.winmd

  release:
    needs: build-fcitx5-clang
    if: ${{ github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '!release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Nightly release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            Fcitx5-*.tar.bz2
