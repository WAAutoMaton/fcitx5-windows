name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2025
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Core dependencies
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm `
            mingw-w64-clang-x86_64-clang `
            mingw-w64-clang-x86_64-cmake `
            mingw-w64-clang-x86_64-ninja `
            mingw-w64-clang-x86_64-pkgconf `
            mingw-w64-clang-x86_64-gettext-tools `
            mingw-w64-clang-x86_64-extra-cmake-modules `
            mingw-w64-clang-x86_64-dlfcn `
            mingw-w64-clang-x86_64-libuv `
            mingw-w64-clang-x86_64-boost `
            mingw-w64-clang-x86_64-zstd
          Add-Content $env:GITHUB_PATH 'C:/msys64/clang64/bin'

      - name: Build complete Release runtime tree without tests
        run: ./scripts/build-and-deploy.ps1 -Prefix ./dist/ci-runtime -BuildRoot ./build/ci-x64 -DataMode Prebuilt -SkipTests

      - name: Prepare portable TSF tests and probes
        run: |
          $build = (Resolve-Path build/ci-x64/tsf).Path.Replace('\', '/')
          $manifest = & ctest --test-dir $build --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'CTest enumeration failed.' }
          $tests = ($manifest | Out-String | ConvertFrom-Json).tests
          if (!$tests.Count) { throw 'No default TSF tests were found.' }
          $bundle = 'build/ci-x64/test-bundle'
          New-Item -ItemType Directory -Force "$bundle/tests", "$bundle/dll" | Out-Null
          Copy-Item "$build/tests/*.exe" "$bundle/tests"
          Copy-Item "$build/dll/fcitx5-x86_64.dll", "$build/dll/penguin.ico" "$bundle/dll"
          function Convert-TestArgument([string]$Value) {
            $value = $Value.Replace('\', '/')
            if ($value.StartsWith("$build/", [StringComparison]::OrdinalIgnoreCase)) {
              return @{ path = $value.Substring($build.Length + 1) }
            } elseif ([IO.Path]::IsPathRooted($value)) {
              throw "Test argument is outside the TSF build: $Value"
            }
            return @{ value = $Value }
          }
          $registration = foreach ($test in $tests) {
            if (@($test.properties | Where-Object name -ne 'WORKING_DIRECTORY').Count) {
              throw "Unsupported portable test properties: $($test.name)"
            }
            @{
              name = $test.name
              command = @($test.command | ForEach-Object { Convert-TestArgument $_ })
              workingDirectory = Convert-TestArgument ($test.properties | Where-Object name -eq 'WORKING_DIRECTORY').value
            }
          }
          ConvertTo-Json -InputObject @($registration) -Depth 5 | Set-Content "$bundle/tests.json" -Encoding utf8

      - name: Upload shared runtime tree
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-runtime-x64
          path: dist/ci-runtime/
          if-no-files-found: error

      - name: Upload portable TSF tests and probes
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-tests-x64
          path: build/ci-x64/test-bundle/
          if-no-files-found: error

      - name: Upload settings application
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-settings-x64
          path: dist/ci-runtime/settings/
          if-no-files-found: error

  test-x64:
    needs: build-x64
    runs-on: windows-2025
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Download shared runtime tree
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-x64
          path: dist/ci-runtime

      - name: Download portable TSF tests and probes
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-tests-x64
          path: build/ci-tests

      - name: Restore portable CTest registration
        run: |
          $bundle = (Resolve-Path build/ci-tests).Path.Replace('\', '/')
          $tests = Get-Content "$bundle/tests.json" -Raw | ConvertFrom-Json
          if (!$tests.Count) { throw 'No portable TSF tests were found.' }
          function Format-TestArgument($Argument) {
            $value = if ($Argument.path) { "$bundle/$($Argument.path)" } else { $Argument.value }
            return '"' + $value.Replace('\', '/').Replace('$', '\$').Replace('"', '\"') + '"'
          }
          $registration = foreach ($test in $tests) {
            $name = Format-TestArgument @{ value = $test.name }
            $arguments = @($test.command | ForEach-Object { Format-TestArgument $_ })
            'add_test(' + $name + ' ' + ($arguments -join ' ') + ')'
            'set_tests_properties(' + $name + ' PROPERTIES WORKING_DIRECTORY ' + (Format-TestArgument $test.workingDirectory) + ')'
          }
          $registration | Set-Content "$bundle/CTestTestfile.cmake" -Encoding utf8

      - name: Test unified build script
        run: ./scripts/test-build-and-deploy.ps1

      - name: Check generated icon against the existing checksum
        run: |
          $expected = ((Get-Content win32/checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash build/ci-tests/dll/penguin.ico -Algorithm MD5).Hash
          if ($actual -ne $expected) { throw 'Generated icon checksum mismatch.' }

      - name: Verify real Pinyin and unregistered TSF text contexts
        run: ./scripts/test-pinyin.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Verify input method selection, settings and real Wubi commits
        run: ./scripts/test-inputmethods.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Verify third-party dictionary loading
        run: ./scripts/test-dictionaries.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pinyin-test-logs
          path: |
            build/pinyin-test/*.log
            build/dictionaries-test/*.log
            build/inputmethods-test/**/*.log
            build/ci-tests/Testing/Temporary/*.log

  package-installer-x64:
    needs: build-x64
    runs-on: windows-2025
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download shared runtime tree
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-x64
          path: dist/installer-stage

      - name: Install Inno Setup compiler
        run: winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements

      - name: Check Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:/Program Files (x86)/Inno Setup 7', 'C:/Program Files/Inno Setup 7', "$env:LOCALAPPDATA/Programs/Inno Setup 7" -Filter ISCC.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe was not installed.' }
          $version = (& $iscc.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^7\.\d+\.\d+(?:\..*)?(?:-.*)?$') { throw "Inno Setup 7 is required, got: $version" }
          Write-Output "Using $($iscc.FullName)"
          Write-Output "Inno Setup version: $version"
          Get-AuthenticodeSignature $iscc.FullName | Format-List Status,SignerCertificate
          "FCITX5_ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download locked runtime dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/installer-deps | Out-Null
          Invoke-WebRequest -Uri 'https://download.visualstudio.microsoft.com/download/pr/bd1c8d9d-ba95-4eee-bc6e-df1fcc876373/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe' -OutFile build/installer-deps/vc_redist.x64.exe
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/8eb5473d-5663-4337-a1ca-aa5030b9b194/WindowsAppRuntimeInstall-x64.exe' -OutFile build/installer-deps/WindowsAppRuntimeInstall-x64.exe
          if ((Get-FileHash build/installer-deps/vc_redist.x64.exe -Algorithm SHA256).Hash -ne 'CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B') { throw 'VC++ runtime hash mismatch.' }
          if ((Get-FileHash build/installer-deps/WindowsAppRuntimeInstall-x64.exe -Algorithm SHA256).Hash -ne '7C092E85FC1E3E7CB2BD7D549AAAB03CAF924131F15D9B20B1855457A98205AA') { throw 'Windows App Runtime hash mismatch.' }

      - name: Test installer packaging script
        run: ./scripts/test-build-installer.ps1

      - name: Build installers with and without runtimes
        run: |
          ./scripts/build-installer.ps1 -IsccPath $env:FCITX5_ISCC_PATH -Prefix ./dist/installer-stage -Dependencies ./build/installer-deps -Output ./dist/installer -PackageVersion 0.1.${{ github.run_number }}.0 -PackageName Fcitx5-${{ github.run_number }}-x64-setup
          ./scripts/build-installer.ps1 -IsccPath $env:FCITX5_ISCC_PATH -Prefix ./dist/installer-stage -Output ./dist/installer -PackageVersion 0.1.${{ github.run_number }}.0 -PackageName Fcitx5-${{ github.run_number }}-x64-no-runtime-setup -SkipRuntimes

      - name: Verify installer metadata
        run: |
          Get-ChildItem dist/installer
          foreach ($package in @('Fcitx5-${{ github.run_number }}-x64-setup', 'Fcitx5-${{ github.run_number }}-x64-no-runtime-setup')) {
            foreach ($suffix in @('.exe', '.exe.sha256', '.manifest.txt')) {
              if (!(Test-Path -LiteralPath "dist/installer/$package$suffix" -PathType Leaf)) {
                throw "Installer output missing: $package$suffix"
              }
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-installer-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/*.txt

  installer-smoke-x64:
    needs: package-installer-x64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-installer-x64
          path: dist/installer

      - name: Run install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/installer -Filter '*-x64-no-runtime-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one no-runtime installer, found $($installer.Count)." }
          ./scripts/test-installer.ps1 -InstallerPath $installer[0].FullName

      - name: Upload installer smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-logs
          if-no-files-found: warn
          path: build/installer-smoke

  release:
    needs: [build-x64, test-x64, package-installer-x64, installer-smoke-x64]
    if: ${{ github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '!release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-installer-x64

      - name: Create Nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s failglob
          files=(
            Fcitx5-*-x64-setup.exe
            Fcitx5-*-x64-setup.exe.sha256
            Fcitx5-*-x64-no-runtime-setup.exe
            Fcitx5-*-x64-no-runtime-setup.exe.sha256
          )

          release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == "latest") | .id')
          tag_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
            --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
          if [[ -n "$release_id" ]]; then
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          fi
          if [[ -n "$tag_ref" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
          gh release create latest "${files[@]}" --verify-tag \
            --title 'Nightly Build' --prerelease --generate-notes
